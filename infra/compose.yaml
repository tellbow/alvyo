name: alvyo

# Ports on this machine only: not reachable from a shared network.
services:
  db:
    build: ./postgis
    image: alvyo-postgis:18
    environment:
      POSTGRES_USER: alvyo
      POSTGRES_PASSWORD: alvyo
      POSTGRES_DB: alvyo
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alvyo -d alvyo"]
      interval: 5s
      timeout: 3s
      retries: 20

  tilecache:
    image: nginx:1.30-alpine
    ports: ["127.0.0.1:8081:8080"]
    volumes:
      - ./tilecache/nginx.conf:/etc/nginx/nginx.conf:ro
      - tilecache:/var/cache/nginx
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5

  graphhopper:
    build: ./graphhopper
    image: alvyo-graphhopper:11.0
    environment:
      JAVA_OPTS: "-Xms1g -Xmx6g"
    ports: ["127.0.0.1:8989:8989"]
    volumes:
      - ./data/osm:/data/osm:ro
      - ./data/graph-cache:/data/graph-cache
      - ./data/elevation-cache:/data/elevation-cache # terrain tiles for the slopes
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8989/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30m # first start imports the OSM file

  # One-shot: make osm-fetch (downloads + merges the OSM extracts).
  osm-fetch:
    build: ./data-import
    image: alvyo-data-import
    profiles: [data]
    volumes:
      - ./data:/data
      - ./data-import:/scripts:ro
    command: ["sh", "/scripts/fetch-and-merge.sh"]

  # One-shot: make tlm-import (swissTLM3D hiking trails into PostGIS).
  tlm-import:
    image: alvyo-data-import
    build: ./data-import
    profiles: [data]
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: alvyo
      PGPASSWORD: alvyo
      PGDATABASE: alvyo
    volumes:
      - ./data:/data
      - ./data-import:/scripts:ro
    command: ["sh", "/scripts/import-tlm.sh"]

  # One-shot: make places-import (stops, huts, accommodation into PostGIS).
  places-import:
    image: alvyo-data-import
    build: ./data-import
    profiles: [data]
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: alvyo
      PGPASSWORD: alvyo
      PGDATABASE: alvyo
    volumes:
      - ./data:/data
      - ./data-import:/scripts:ro
    command: ["sh", "/scripts/import-places.sh"]

  # One-shot: make wanderland-import (the official routes of Wanderland
  # Schweiz; the API makes them routes and journeys after its next check).
  wanderland-import:
    image: alvyo-data-import
    build: ./data-import
    profiles: [data]
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: alvyo
      PGPASSWORD: alvyo
      PGDATABASE: alvyo
    volumes:
      - ./data:/data
      - ./data-import:/scripts:ro
    command: ["sh", "/scripts/import-wanderland.sh"]

  # One-shot: make weather-precip (rain pictures for the map: radar and forecast).
  weather-precip:
    image: alvyo-data-import
    build: ./data-import
    profiles: [data]
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: alvyo
      PGPASSWORD: alvyo
      PGDATABASE: alvyo
    volumes:
      - ./data-import:/scripts:ro
    command: ["python3", "/scripts/weather-precip.py"]

  # One-shot: make snow-cover (Copernicus's snow cover as map tiles).
  snow-cover:
    image: alvyo-data-import
    build: ./data-import
    profiles: [data]
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: alvyo
      PGPASSWORD: alvyo
      PGDATABASE: alvyo
    volumes:
      - ./data-import:/scripts:ro
    command: ["python3", "/scripts/snow-cover.py"]

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025" # web UI + API
      - "127.0.0.1:1025:1025" # SMTP

volumes:
  pgdata:
  tilecache:
