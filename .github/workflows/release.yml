name: release

# A version tag (v0.1.0) publishes all images to GHCR for amd64 and arm64,
# tagged 0.1.0 and sha-<commit>, each with an SBOM and its provenance; then a
# GitHub Release with the version's row of docs/plan.md as its notes,
# alvyo-cli for Linux, macOS and Windows, and the Android app (APK).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Only a tag signed with the key of .github/release-signers.asc releases:
  # the images are built from what its signer tagged.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # with the tag objects, not only the commit
      - run: |
          gpg --batch --import .github/release-signers.asc
          git verify-tag "$GITHUB_REF_NAME"

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing (cosign)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, context: ., file: api/Dockerfile }
          - { name: web, context: web, file: web/Dockerfile }
          - { name: postgis, context: infra/postgis, file: infra/postgis/Dockerfile }
          - { name: graphhopper, context: infra/graphhopper, file: infra/graphhopper/Dockerfile }
          - { name: data-import, context: infra/data-import, file: infra/data-import/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # api and web cross-compile; the others run apt/curl under emulation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/alvyo-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Shown on the About page next to the source link (AGPL §13).
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # What is in the image and how it was built, pushed with it
          # (docker buildx imagetools inspect … --format '{{json .SBOM}}').
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Signed with this workflow's identity (Sigstore's certificate, entered in
      # its public transparency log: the image's digest, this repository and
      # tag become public there); cosign verify in docs/operations.md.
      - name: Sign the image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/alvyo-${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache: false # a release builds once
      - name: alvyo-cli for each platform
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}" arch="${target#*/}" ext=""
            [ "$os" = windows ] && ext=.exe
            (cd api && CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$v" \
              -o "../dist/alvyo-cli-$v-$os-$arch$ext" ./cmd/alvyo-cli)
          done
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: false # a release builds once
      # Signed with the release key (app/README.md): every later APK must be
      # signed with the same key, or phones refuse it as an update.
      - name: Android app (APK)
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$ANDROID_KEYSTORE" ] || { echo "::error::secret ANDROID_KEYSTORE is missing (app/README.md)"; exit 1; }
          v="${GITHUB_REF_NAME#v}"
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/alvyo.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=alvyo\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/alvyo.jks" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEYSTORE_PASSWORD" > app/android/key.properties
          (cd app && flutter build apk --release --build-name="$v" --build-number="$(git rev-list --count HEAD)" \
            --dart-define=ALVYO_VERSION="$GITHUB_REF_NAME")
          cp app/build/app/outputs/flutter-apk/app-release.apk "dist/alvyo-$v.apk"
          rm "$RUNNER_TEMP/alvyo.jks" app/android/key.properties
      - name: Checksums
        run: (cd dist && sha256sum alvyo-* > SHA256SUMS)
      - name: Notes from docs/plan.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          # The version's row (| 0.29.1 | date | what |), else the tag's message.
          what=$(awk -F ' [|] ' -v v="$v" '$1 == "| " v { sub(/ [|]$/, "", $3); print $3 }' docs/plan.md)
          [ -n "$what" ] || what=$(git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents)')
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo "$what"
            echo
            echo "Images: \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/alvyo-{api,web,data-import,postgis,graphhopper}:$v\`"
            echo
            echo "alvyo-cli for AI assistants and the command line: below (docs/mcp.md)."
            echo
            echo "The Android app: alvyo-$v.apk below, to install on the phone (app/README.md)."
            if [ -n "$prev" ]; then
              echo
              echo "Changes: https://github.com/${GITHUB_REPOSITORY}/compare/$prev...$GITHUB_REF_NAME"
            fi
          } > notes.md
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "Alvyo ${GITHUB_REF_NAME#v}" --notes-file notes.md dist/*
