name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Weekly as well: new vulnerabilities and broken upstreams show up
  # without a commit.
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [swiss, api]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - run: go vet ./...
        working-directory: ${{ matrix.module }}
      # Known vulnerabilities in the code paths actually called.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
        working-directory: ${{ matrix.module }}
      - name: Build PostGIS image for integration tests
        if: matrix.module == 'api'
        run: docker build -t alvyo-postgis:18 infra/postgis
      - run: go test -race ./...
        working-directory: ${{ matrix.module }}
        env:
          # Ryuk (testcontainers' clean-up) sometimes loses its connection and
          # then removes the database mid-test; the runner is thrown away anyway.
          TESTCONTAINERS_RYUK_DISABLED: "true"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.10
          working-directory: ${{ matrix.module }}

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run test:unit --run --passWithNoTests

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      # Unit and widget tests; the integration tests need a simulator and the
      # dev stack (app/README.md).
      - run: flutter test

  # The supply chain: vulnerable npm and pub packages, risky workflow
  # patterns, secrets in the history.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27' # osv-scanner 2.6 needs it; only the tool runs here
      - name: osv-scanner (web and app lockfiles; Go is govulncheck's)
        run: go run github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.6.0 scan source -L web/bun.lock -L app/pubspec.lock
      - name: zizmor (workflows)
        run: pipx run zizmor==1.30.1 --format=github .github/workflows
      - name: gitleaks (history, test passwords allowed by .gitleaks.toml)
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
          git /repo --redact --no-banner -c /repo/.gitleaks.toml

  # The images of a release still build (base image or Dockerfile changes).
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f api/Dockerfile .
      - run: docker build web

  # Static analysis with semgrep's default rules. Excluded after a look at
  # each finding (2026-10-08):
  #   cookie-missing-secure: Secure follows ALVYO_PUBLIC_URL (off only on
  #     plain-HTTP localhost);
  #   iterate-over-empty-map: the maps are filled in the loops it means;
  #   dynamic-urllib-use-detected: the URLs are MeteoSwiss's catalogue's;
  #   missing-internal: the tile cache's locations are public on purpose;
  #   npm-missing-minimum-release-age: Renovate waits 7 days (bun, not npm).
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: >-
          pipx run semgrep==1.180.0 scan --config p/default --metrics=off --error
          --exclude-rule go.lang.security.audit.net.cookie-missing-secure.cookie-missing-secure
          --exclude-rule trailofbits.go.iterate-over-empty-map.iterate-over-empty-map
          --exclude-rule python.lang.security.audit.dynamic-urllib-use-detected.dynamic-urllib-use-detected
          --exclude-rule generic.nginx.security.missing-internal.missing-internal
          --exclude-rule package_managers.npm.npm-missing-minimum-release-age.npm-missing-minimum-release-age
