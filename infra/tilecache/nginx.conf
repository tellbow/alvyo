# Caching proxy for swisstopo WMTS tiles (EPSG:3857) and terrain tiles.
# swisstopo geoservices are free (OGD) but "excessive use may be restricted",
# so every tile is fetched upstream at most once per cache lifetime.
worker_processes auto;
# Runs as nginx (uid 101), not root: what it writes besides the cache
# goes to /tmp.
pid /tmp/nginx.pid;
events { worker_connections 4096; }

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;
  # proxy_pass with variables resolves at runtime: Docker's DNS (no public
  # fallback over plain UDP, which a spoofed answer could use).
  resolver 127.0.0.11 valid=300s ipv6=off;
  # Upstream certificates are checked: a tile served by someone else would
  # be cached for everyone for weeks.
  proxy_ssl_verify on;
  proxy_ssl_verify_depth 3;
  proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
  server_tokens off;

  proxy_cache_path /var/cache/nginx/wmts levels=1:2 keys_zone=wmts:100m
                   max_size=60g inactive=180d use_temp_path=off;
  # Per client: zooming on a large screen asks for hundreds of tiles in a
  # second or two (three layers, several zoom levels). A refused tile shows
  # another zoom level in its place, so the limit only stops scrapers.
  limit_req_zone $binary_remote_addr zone=tiles_ip:20m rate=100r/s;
  # Behind Caddy the client address is in X-Forwarded-For (Caddy replaces any
  # value the client sent); without this every user shares Caddy's limit.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;

  # Only these layers may be proxied (value = allowed file extension).
  map $layer $layer_ext {
    default                                       "";
    ch.swisstopo.pixelkarte-farbe                 jpeg;
    ch.swisstopo.pixelkarte-grau                  jpeg;
    ch.swisstopo.swissimage                       jpeg;
    ch.swisstopo.swisstlm3d-wanderwege            png;
    ch.astra.wanderland                           png;
    ch.swisstopo.hangneigung-ueber_30             png;
    ch.swisstopo.swissalti3d-reliefschattierung   png;
    ch.bafu.wrz-wildruhezonen_portal              png;
    ch.bafu.bundesinventare-jagdbanngebiete       png;
  }

  server {
    listen 8080;

    location ~ "^/tiles/wmts/(?<layer>[a-z0-9._-]+)/(?<z>[0-9]{1,2})/(?<x>[0-9]+)/(?<y>[0-9]+)\.(?<ext>jpeg|png)$" {
      if ($layer_ext != $ext) { return 404; }
      limit_req zone=tiles_ip burst=1000 nodelay;

      proxy_pass https://wmts.geo.admin.ch/1.0.0/$layer/default/current/3857/$z/$x/$y.$ext;
      proxy_ssl_server_name on;
      proxy_ssl_name wmts.geo.admin.ch;
      proxy_set_header Host wmts.geo.admin.ch;
      proxy_set_header User-Agent "alvyo-tilecache/0.1 (+https://github.com/tellbow/alvyo)";
      proxy_set_header Cookie "";
      proxy_hide_header Set-Cookie;
      # Ours below replaces swisstopo's (max-age=3600): one header, not two.
      proxy_hide_header Cache-Control;
      proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;

      proxy_cache wmts;
      proxy_cache_key "$layer/$z/$x/$y.$ext";
      proxy_cache_valid 200 30d;
      proxy_cache_valid 204 404 1d;
      proxy_cache_lock on;
      proxy_cache_background_update on;
      proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
      proxy_connect_timeout 5s;
      proxy_read_timeout 15s;

      add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
      add_header X-Cache-Status $upstream_cache_status always;
      add_header X-Content-Type-Options nosniff always;
    }

    # Terrain for 3D: Mapterhorn's open terrain tiles (terrarium in WebP,
    # from open elevation models, swissALTI3D among them).
    location ~ "^/tiles/terrain/(?<z>[0-9]{1,2})/(?<x>[0-9]+)/(?<y>[0-9]+)\.webp$" {
      limit_req zone=tiles_ip burst=1000 nodelay;

      proxy_pass https://tiles.mapterhorn.com/$z/$x/$y.webp;
      proxy_ssl_server_name on;
      proxy_ssl_name tiles.mapterhorn.com;
      proxy_set_header Host tiles.mapterhorn.com;
      proxy_set_header User-Agent "alvyo-tilecache/0.1 (+https://github.com/tellbow/alvyo)";
      proxy_set_header Cookie "";
      proxy_hide_header Set-Cookie;
      proxy_hide_header Cache-Control;
      proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;

      proxy_cache wmts;
      proxy_cache_key "terrain/$z/$x/$y.webp";
      proxy_cache_valid 200 30d;
      proxy_cache_valid 204 404 1d;
      proxy_cache_lock on;
      proxy_cache_background_update on;
      proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
      proxy_connect_timeout 5s;
      proxy_read_timeout 15s;

      add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
      add_header X-Cache-Status $upstream_cache_status always;
      add_header X-Content-Type-Options nosniff always;
    }

    location = /healthz { return 200 "ok\n"; }
    location / { return 404; }
  }
}
