version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - revive
  settings:
    misspell:
      # E-mails in French and Italian use words that are English misspellings.
      ignore-rules:
        - terminato
formatters:
  enable:
    - gofmt
    - goimports
