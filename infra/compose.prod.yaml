# Production stack: docker compose -f compose.prod.yaml --env-file .env up -d
# Needs the OSM extract in ./data/osm (make osm-fetch) and, once, the trail
# and place imports (docker compose -f compose.prod.yaml run --rm tlm-import,
# then places-import).
name: alvyo-prod

# Logs (they contain IP addresses) are rotated by size and kept briefly.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  caddy:
    logging: *logging
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api, tilecache]

  web:
    logging: *logging
    build: ../web
    image: alvyo-web:${VERSION:-dev}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8080
      PUBLIC_CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      # Who answers for the site (about page, data protection): name and postal address.
      PUBLIC_OPERATOR_NAME: ${OPERATOR_NAME:-}
      PUBLIC_OPERATOR_ADDRESS: ${OPERATOR_ADDRESS:-}

  api:
    logging: *logging
    build:
      context: ..
      dockerfile: api/Dockerfile
      args: { VERSION: "${VERSION:-dev}" }
    image: alvyo-api:${VERSION:-dev}
    restart: unless-stopped
    environment: &api-env
      ALVYO_DATABASE_URL: postgres://alvyo:${POSTGRES_PASSWORD}@db:5432/alvyo?sslmode=disable
      ALVYO_PUBLIC_URL: https://${DOMAIN}
      ALVYO_TRUST_PROXY: "true"
      ALVYO_GRAPHHOPPER_URL: http://graphhopper:8989
      ALVYO_TILES_URL: http://tilecache:8080
      ALVYO_CACHE_DIR: /cache
      ALVYO_PHOTOS_DIR: /data/photos
      # swisstopo's heights as tiles (alti-import); until they are there,
      # and beyond the border, geo.admin's profile service.
      ALVYO_SWISSALTI3D_DIR: /data/alti
      ALVYO_SMTP_HOST: ${SMTP_HOST}
      ALVYO_SMTP_PORT: ${SMTP_PORT:-587}
      ALVYO_SMTP_USER: ${SMTP_USER:-}
      ALVYO_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ALVYO_SMTP_TLS: ${SMTP_TLS:-starttls}
      ALVYO_MAIL_FROM: ${MAIL_FROM}
      # opentransportdata.swiss API key; empty turns connection search off.
      ALVYO_OJP_TOKEN: ${OJP_TOKEN:-}
      # Sign-in providers (docs/operations.md), e.g. OIDC_PROVIDERS=google.
      ALVYO_OIDC_PROVIDERS: ${OIDC_PROVIDERS:-}
      ALVYO_OIDC_GOOGLE_NAME: Google
      ALVYO_OIDC_GOOGLE_ISSUER: https://accounts.google.com
      ALVYO_OIDC_GOOGLE_CLIENT_ID: ${OIDC_GOOGLE_CLIENT_ID:-}
      ALVYO_OIDC_GOOGLE_CLIENT_SECRET: ${OIDC_GOOGLE_CLIENT_SECRET:-}
      ALVYO_OIDC_APPLE_NAME: Apple
      ALVYO_OIDC_APPLE_ISSUER: https://appleid.apple.com
      ALVYO_OIDC_APPLE_CLIENT_ID: ${OIDC_APPLE_CLIENT_ID:-}
      ALVYO_OIDC_APPLE_TEAM_ID: ${OIDC_APPLE_TEAM_ID:-}
      ALVYO_OIDC_APPLE_KEY_ID: ${OIDC_APPLE_KEY_ID:-}
      ALVYO_OIDC_APPLE_APP_ID: ${OIDC_APPLE_APP_ID:-}
      ALVYO_OIDC_APPLE_KEY: ${OIDC_APPLE_KEY:-}
    volumes: [api_cache:/cache, photos:/data/photos, ./data/alti:/data/alti:ro]
    depends_on:
      migrate: { condition: service_completed_successfully }
      graphhopper: { condition: service_started }

  migrate:
    image: alvyo-api:${VERSION:-dev}
    pull_policy: never # built by the api service
    command: ["migrate"]
    environment: *api-env
    depends_on:
      db: { condition: service_healthy }

  db:
    logging: *logging
    build: ./postgis
    image: alvyo-postgis:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: alvyo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: alvyo
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alvyo -d alvyo"]
      interval: 5s
      timeout: 3s
      retries: 20

  graphhopper:
    logging: *logging
    build: ./graphhopper
    image: alvyo-graphhopper:11.0
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Xms1g -Xmx3g"
    volumes:
      - ./data/osm:/data/osm:ro
      - ./data/graph-cache:/data/graph-cache
      - ./data/elevation-cache:/data/elevation-cache # terrain tiles for the slopes

  tilecache:
    logging: *logging
    image: nginx:1.30-alpine
    restart: unless-stopped
    volumes:
      - ./tilecache/nginx.conf:/etc/nginx/nginx.conf:ro
      - tilecache:/var/cache/nginx

  # One-shot: swissTLM3D hiking trails (yearly update).
  tlm-import:
    image: alvyo-data-import
    build: ./data-import
    profiles: [data]
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: alvyo
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: alvyo
    volumes:
      - ./data:/data
      - ./data-import:/scripts:ro
    command: ["sh", "/scripts/import-tlm.sh"]

  # One-shot: stops (BAV) and huts/accommodation (OSM), after each OSM fetch.
  places-import:
    image: alvyo-data-import
    build: ./data-import
    profiles: [data]
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: alvyo
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: alvyo
    volumes:
      - ./data:/data
      - ./data-import:/scripts:ro
    command: ["sh", "/scripts/import-places.sh"]

  # The rain on the map (radar and forecast) every 5 minutes, as the
  # cluster's CronJob does: compose has no schedule, so the service loops.
  weather-precip:
    image: alvyo-data-import
    build: ./data-import
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: alvyo
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: alvyo
      HOME: /tmp
    volumes:
      - ./data-import:/scripts:ro
    command: ["sh", "-c", "while true; do python3 /scripts/weather-precip.py; sleep 300; done"]

  # The snow cover on the map (Copernicus, daily, published around 00:30
  # UTC); looked for every 6 hours, a day is converted once.
  snow-cover:
    image: alvyo-data-import
    build: ./data-import
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: alvyo
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: alvyo
      HOME: /tmp
    volumes:
      - ./data-import:/scripts:ro
    command: ["sh", "-c", "while true; do python3 /scripts/snow-cover.py; sleep 21600; done"]

  # One-shot: the official routes of Wanderland Schweiz (a few updates a
  # year); the API makes them routes and journeys after its next check.
  wanderland-import:
    image: alvyo-data-import
    build: ./data-import
    profiles: [data]
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: alvyo
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: alvyo
    volumes:
      - ./data:/data
      - ./data-import:/scripts:ro
    command: ["sh", "/scripts/import-wanderland.sh"]

  # One-shot: swisstopo's height model for the API (about 5 hours the first
  # time, then only changed tiles); once a year.
  alti-import:
    image: alvyo-data-import
    build: ./data-import
    profiles: [data]
    volumes:
      - ./data:/data
      - ./data-import:/scripts:ro
    entrypoint: ["python3", "/scripts/swissalti3d.py"]

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  api_cache:
  photos:
  tilecache:
