name: e2e

# The website's end-to-end tests against the whole dev stack: PostGIS with
# the trails and places, GraphHopper with the Swiss graph, the tile cache
# and Mailpit. The graph and the imported files come from the cache; they
# are built again (about an hour) only when the routing or the imports
# change.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly as well: keeps the cache (dropped after 7 days unused) and shows
  # broken upstreams.
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  # Not cancelled: a new push would throw away a graph being built.
  cancel-in-progress: false

env:
  COMPOSE: docker compose -f infra/compose.yaml

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # What the graph and the imports are built from; the files the
      # importers download again only when changed upstream.
      - name: Restore data
        id: data
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: e2e-data-${{ hashFiles('infra/graphhopper/**', 'infra/data-import/fetch-and-merge.sh', 'infra/data-import/border.geojson') }}
          path: |
            infra/data/osm/ch-fl.osm.pbf
            infra/data/graph-cache
            infra/data/elevation-cache
            infra/data/tlm/SWISSTLM3D_WANDERWEGE.gpkg
            infra/data/places/stops.gpkg.zip
            infra/data/wanderland/wanderland.gpkg

      # GraphHopper (uid 1000) and the importers write into infra/data.
      - run: mkdir -p infra/data/graph-cache infra/data/elevation-cache && chmod -R a+rwX infra/data

      - name: Fetch OSM extracts
        if: steps.data.outputs.cache-hit != 'true'
        run: |
          $COMPOSE run --rm osm-fetch
          # Only the merged file is needed; the runner's disk is small.
          sudo find infra/data/osm -name '*-latest.osm.pbf' -delete

      - name: Start the stack
        run: $COMPOSE up -d --build --wait db tilecache mailpit && $COMPOSE up -d --build graphhopper

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Import trails, places and Wanderland routes
        env:
          ALVYO_DATABASE_URL: postgres://alvyo:alvyo@localhost:5432/alvyo?sslmode=disable
        run: |
          go run ./api/cmd/alvyo migrate
          $COMPOSE run --rm tlm-import
          $COMPOSE run --rm places-import
          $COMPOSE run --rm wanderland-import

      # The first start imports the graph (with elevation): about an hour.
      - name: Wait for GraphHopper
        timeout-minutes: 90
        run: |
          until curl -fs http://localhost:8989/health >/dev/null; do
            if [ "$(docker inspect -f '{{.State.Running}}' alvyo-graphhopper-1)" != true ]; then
              $COMPOSE logs --tail 50 graphhopper
              exit 1
            fi
            sleep 15
          done

      - name: Save data
        if: steps.data.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.data.outputs.cache-primary-key }}
          path: |
            infra/data/osm/ch-fl.osm.pbf
            infra/data/graph-cache
            infra/data/elevation-cache
            infra/data/tlm/SWISSTLM3D_WANDERWEGE.gpkg
            infra/data/places/stops.gpkg.zip
            infra/data/wanderland/wanderland.gpkg

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bunx playwright install --with-deps chromium webkit
        working-directory: web
      # Playwright starts the API, the fake identity provider and the web app.
      - run: bunx playwright test
        working-directory: web

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
      - name: Logs of the stack
        if: failure()
        run: $COMPOSE logs --tail 200 graphhopper db
